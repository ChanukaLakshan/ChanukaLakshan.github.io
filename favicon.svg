<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3358" />
      <stop offset="50%" stop-color="#ff0033" />
      <stop offset="100%" stop-color="#99001f" />
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff0033" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ff0033" stop-opacity="0" />
    </radialGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="502" height="502" x="5" y="5" rx="123" fill="none" stroke="url(#redGrad)" stroke-width="10" stroke-opacity="0.75" />

  <!-- Ambient Red Core Glow -->
  <circle cx="256" cy="256" r="210" fill="url(#glow)" />

  <!-- Monogram CL -->
  <g filter="url(#neonGlow)">
    <!-- 'C' Monogram (Pure Clean Titanium) -->
    <path d="M 230 160 L 175 160 C 135 160 108 188 108 228 L 108 284 C 108 324 135 352 175 352 L 230 352" 
          fill="none" 
          stroke="url(#whiteGrad)" 
          stroke-width="38" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- 'L' Monogram (Premium Crimson Blade) -->
    <path d="M 288 150 L 288 352 L 398 352" 
          fill="none" 
          stroke="url(#redGrad)" 
          stroke-width="40" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Sleek Tech Accent Dot -->
    <circle cx="398" cy="300" r="10" fill="#ff3358" />
  </g>
</svg>
